<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konfirmasi Hasil Seleksi Vendor</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; color: #2C3E50; background: #fdf6f3; }
  h2 { margin-bottom: 4px; color: #3d3d3d; }
  .meta { color: #8a8a8a; margin-bottom: 20px; }

  .rfq-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(61, 61, 61, 0.12);
    padding: 32px;
  }

  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: none; }
  th, td { border: none; border-bottom: 1px solid #eee; padding: 12px 10px; font-size: 14px; text-align: left; }
  th { background: #3d3d3d; color: white; }
  th:first-child { border-top-left-radius: 8px; }
  th:last-child { border-top-right-radius: 8px; }

  input, textarea {
    width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    font-size: 14px;
    border: 1.5px solid #e6ded9;
    border-radius: 8px;
    background: #fdfaf9;
    font-family: inherit;
  }

  button { background: #e8562c; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 8px; }
  button:hover:not(:disabled) { background: #c8451f; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.secondary { background: #fff; color: #666; border: 1.5px solid #e6ded9; }
  button.secondary:hover:not(:disabled) { background: #f5f0ee; }

  #error, #success { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  #error { background: #FADBD8; color: #C0392B; }
  #success { background: #D5F4E6; color: #1E8449; }

  .summary { border-top: 2px solid #eee; margin: 16px 0; padding-top: 12px; }
  .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
  .summary-row.total { font-weight: bold; font-size: 18px; border-top: 1px solid #eee; margin-top: 4px; padding-top: 10px; color: #3d3d3d; }

  .brand { text-align: center; margin-bottom: 24px; }
  .brand img { height: 56px; }
  .brand .powered { font-size: 10px; color: #999; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; }

  .pin-card {
    max-width: 380px;
    margin: 60px auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(61, 61, 61, 0.14);
    padding: 32px 28px;
    text-align: center;
  }
  .pin-card p { color: #666; font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  .pin-card input {
    text-align: center;
    font-size: 24px;
    letter-spacing: 10px;
    padding: 12px;
    width: 180px;
    margin-bottom: 16px;
  }
  .pin-card button { width: 100%; }
  .pin-card .pin-error { color: #C0392B; font-size: 13px; margin-top: 12px; display: none; }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: #D5F4E6;
    color: #1E8449;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div class="brand">
  <img src="logo-bima.png" alt="BIMA - Bilal Mitra Aryatama">
  <div class="powered">Powered by Fusion Four</div>
</div>

<div id="error"></div>
<div id="success"></div>
<div id="app">Memuat data RFQ...</div>

<script>
const SUPABASE_URL = 'https://nhmpwjriextmbotmvvbu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XNqLw7iz873TtrLn9ag8dQ_AkL2rImz';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const RFQ_EMAIL_URL = "https://script.google.com/macros/s/AKfycbww8VikG_wpAvQro1-9vLC_llnvKFigFotzKXS-T_kaIHKA4q2QGbYXqZObEF5j_1Hr/exec";
const HO_EMAIL = "rovan.syahriza@gmail.com";

const params = new URLSearchParams(window.location.search);
const rfqIdParam = Number(params.get("rfq"));
const vendorIdParam = Number(params.get("vendor"));

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = "block";
  document.getElementById("app").innerHTML = "";
}

// Sesi vendor (PIN dicek server) per tab, khusus undangan ini. PIN gak dikirim ke
// browser lagi -- dulu dicocokkan di browser & bisa diintip.
const VENDOR_TOKEN_KEY = 'vendorRfq:' + rfqIdParam + ':' + vendorIdParam;
let vendorToken = null;
function tokenGet() { try { return sessionStorage.getItem(VENDOR_TOKEN_KEY); } catch (e) { return null; } }
function tokenSet(v) { try { v ? sessionStorage.setItem(VENDOR_TOKEN_KEY, v) : sessionStorage.removeItem(VENDOR_TOKEN_KEY); } catch (e) {} }

function tampilkanSudahDiputuskan(keputusan) {
  document.getElementById("app").innerHTML = keputusan === 'Confirmed'
    ? `<div class="rfq-card" style="text-align:center;">
        <div class="badge">Sudah Dikonfirmasi</div>
        <p>Anda sudah mengonfirmasi kesediaan untuk RFQ ini sebelumnya. Terima kasih.</p>
      </div>`
    : `<div class="rfq-card" style="text-align:center;">
        <p>Anda sebelumnya sudah menyatakan tidak dapat memenuhi RFQ ini.</p>
      </div>`;
}

async function init() {
  if (!rfqIdParam || !vendorIdParam) {
    showError("Link tidak lengkap. Pastikan Anda membuka link dari email pemberitahuan hasil seleksi vendor.");
    return;
  }

  try {
    vendorToken = tokenGet();
    if (vendorToken) {
      const { data: sesi } = await supabaseClient.rpc('vendor_rfq_data', { p_token: vendorToken });
      if (sesi && sesi.status === 'OK') { renderDariData(sesi.data); return; }
      tokenSet(null); vendorToken = null;
    }

    const { data: info, error } = await supabaseClient.rpc('vendor_rfq_info', { p_rfqid: rfqIdParam, p_vendorid: vendorIdParam });
    if (error) throw error;
    if (!info || info.status !== 'OK') {
      showError("Link tidak valid atau data tidak ditemukan.");
      return;
    }
    if (info.tahap === 'SUDAH_KONFIRMASI') { tampilkanSudahDiputuskan('Confirmed'); return; }
    if (info.tahap === 'SUDAH_TOLAK') { tampilkanSudahDiputuskan('Rejected'); return; }
    if (info.tahap !== 'PEMENANG') {
      showError("RFQ ini belum di-approve oleh Management, atau bukan Anda vendor yang terpilih.");
      return;
    }
    showPinGate();
  } catch (err) {
    showError("Terjadi kendala memuat data: " + err.message + " Silakan muat ulang halaman.");
  }
}

function showPinGate() {
  document.getElementById("app").innerHTML = `
    <div class="pin-card">
      <p>Masukkan PIN yang dikirimkan melalui email untuk melihat hasil seleksi vendor.</p>
      <input type="text" id="pinInput" maxlength="5" inputmode="numeric" placeholder="•••••">
      <button id="pinSubmitBtn">Buka Detail</button>
      <div class="pin-error" id="pinError">PIN salah. Periksa kembali email Anda.</div>
    </div>
  `;

  let sedangDicek = false;
  document.getElementById("pinSubmitBtn").addEventListener("click", checkPin);
  document.getElementById("pinInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") checkPin();
  });

  async function checkPin() {
    if (sedangDicek) return;
    sedangDicek = true;
    const errEl = document.getElementById("pinError");
    try {
      const entered = document.getElementById("pinInput").value.trim();
      const { data: hasil, error } = await supabaseClient.rpc('vendor_rfq_masuk', { p_rfqid: rfqIdParam, p_vendorid: vendorIdParam, p_pin: entered });
      if (error) throw error;
      if (hasil && hasil.status === 'OK') {
        vendorToken = hasil.token;
        tokenSet(vendorToken);
        renderDariData(hasil.data);
        return;
      }
      let pesan = (hasil && hasil.message) || 'PIN salah. Periksa kembali email Anda.';
      if (hasil && hasil.status === 'INVALID' && hasil.sisa != null) pesan += ` Sisa percobaan: ${hasil.sisa}.`;
      errEl.textContent = pesan;
      errEl.style.display = "block";
    } catch (e) {
      errEl.textContent = "Gagal memeriksa PIN: " + e.message;
      errEl.style.display = "block";
    } finally {
      sedangDicek = false;
    }
  }
}

// Data dari server (vendor_rfq_masuk / vendor_rfq_data) -- tanpa PIN.
function renderDariData(data) {
  const rv = data.rfqVendor || {};
  if (rv.ConfirmationStatus === 'Confirmed' || rv.ConfirmationStatus === 'Rejected') {
    tampilkanSudahDiputuskan(rv.ConfirmationStatus);
    return;
  }
  if (rv.ManagementApproval !== 'Approved' || rv.Status !== 'Approved') {
    showError("RFQ ini belum di-approve oleh Management, atau bukan Anda vendor yang terpilih.");
    return;
  }
  const winningQuotes = (data.quotes || []).filter(q => q.IsSelected === 'Yes');
  if (winningQuotes.length === 0) {
    showError("Tidak ditemukan item yang dimenangkan untuk vendor ini pada RFQ tersebut.");
    return;
  }
  const detailById = {};
  (data.items || []).forEach(d => { detailById[String(d.RFQDetailID)] = d; });
  renderDetail(data.rfq || {}, data.vendor || {}, rv, winningQuotes, detailById, data.term || {});
}

function renderDetail(rfqHeader, vendorInfo, rv, winningQuotes, detailById, term) {
  const noRFQ = rfqHeader ? rfqHeader.NoRFQ : "-";
  const vendorName = vendorInfo ? vendorInfo.VendorName : "-";

  let itemSubtotal = 0;
  const rows = winningQuotes.map((q, idx) => {
    const detail = detailById[String(q.RFQDetailID)] || {};
    const qty = Number(q.Qty) || 0;
    const price = Number(q.UnitPrice) || 0;
    const subtotal = qty * price;
    itemSubtotal += subtotal;
    return `
      <tr>
        <td>${idx + 1}</td>
        <td>${detail.ItemDescription || '-'}</td>
        <td>${qty} ${detail.Unit || ''}</td>
        <td>Rp ${price.toLocaleString('id-ID')}</td>
        <td>Rp ${subtotal.toLocaleString('id-ID')}</td>
      </tr>
    `;
  }).join("");

  const mobilisasi = Number(term.MobilisasiCost) || 0;
  const otherService = Number(term.OtherServiceCost) || 0;
  const ppn = Number(term.PPNAmount) || 0;
  const grandTotal = itemSubtotal + mobilisasi + otherService + ppn;

  document.getElementById("app").innerHTML = `
    <div class="rfq-card">
      <div class="badge">Anda Terpilih Sebagai Pemenang</div>
      <h2>Konfirmasi Hasil Seleksi Vendor</h2>
      <div class="meta">
        No RFQ: <strong>${noRFQ}</strong><br>
        Vendor: <strong>${vendorName}</strong>
      </div>

      <table>
        <thead>
          <tr><th>No</th><th>Item</th><th>Qty</th><th>Harga Satuan</th><th>Subtotal</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>

      <div class="summary">
        <div class="summary-row"><span>Subtotal Item</span><span>Rp ${itemSubtotal.toLocaleString('id-ID')}</span></div>
        ${mobilisasi ? `<div class="summary-row"><span>Mobilisasi</span><span>Rp ${mobilisasi.toLocaleString('id-ID')}</span></div>` : ''}
        ${otherService ? `<div class="summary-row"><span>Biaya Jasa Lain</span><span>Rp ${otherService.toLocaleString('id-ID')}</span></div>` : ''}
        ${ppn ? `<div class="summary-row"><span>PPN</span><span>Rp ${Math.round(ppn).toLocaleString('id-ID')}</span></div>` : ''}
        <div class="summary-row total"><span>Total</span><span>Rp ${grandTotal.toLocaleString('id-ID')}</span></div>
      </div>

      <div style="margin:16px 0;">
        <label style="font-size:13px; color:#666;">Catatan (opsional)</label>
        <textarea id="vendorNotes" rows="2" placeholder="Catatan tambahan, jika ada"></textarea>
      </div>

      <div style="display:flex; gap:12px;">
        <button id="btnConfirm" style="flex:1;">Konfirmasi Kesediaan</button>
        <button id="btnReject" class="secondary" style="flex:1;">Tidak Bisa Penuhi</button>
      </div>
    </div>
  `;

  document.getElementById("btnConfirm").addEventListener("click", () => submitDecision(rv, 'Confirmed', rfqHeader, vendorInfo, grandTotal, winningQuotes, detailById));
  document.getElementById("btnReject").addEventListener("click", () => submitDecision(rv, 'Rejected', rfqHeader, vendorInfo, grandTotal, winningQuotes, detailById));
}

async function submitDecision(rv, decision, rfqHeader, vendorInfo, grandTotal, winningQuotes, detailById) {
  const btnConfirm = document.getElementById("btnConfirm");
  const btnReject = document.getElementById("btnReject");
  const notes = document.getElementById("vendorNotes") ? document.getElementById("vendorNotes").value.trim() : null;

  if (decision === 'Rejected' && !confirm("Yakin tidak dapat memenuhi RFQ ini?")) return;

  btnConfirm.disabled = true;
  btnReject.disabled = true;

  try {
    // Keputusan + draft PO lewat RPC: harga/total PO dihitung server dari penawaran yang
    // tersimpan -- dulu TotalAmount & harga item dikirim dari browser vendor.
    const { data: hasil, error } = await supabaseClient.rpc('vendor_rfq_konfirmasi', {
      p_token: vendorToken || '', p_decision: decision, p_notes: notes || null
    });
    if (error) throw error;
    if (!hasil || hasil.status !== 'OK') {
      if (hasil && hasil.status === 'SESSION_EXPIRED') { tokenSet(null); vendorToken = null; }
      if (hasil && hasil.status === 'DONE') { tampilkanSudahDiputuskan(hasil.keputusan); return; }
      throw new Error((hasil && hasil.message) || 'Konfirmasi gagal disimpan.');
    }

    // Kirim notifikasi email ke Admin Perusahaan (HO)
    if (HO_EMAIL) {
      const noRFQ = rfqHeader ? rfqHeader.NoRFQ : `RFQID ${rv.RFQID}`;
      const vendorName = vendorInfo ? vendorInfo.VendorName : `Vendor #${rv.VendorID}`;
      const statusLabel = decision === 'Confirmed' ? 'BERSEDIA MEMENUHI PESANAN' : 'MENOLAK / TIDAK BISA MEMENUHI';
      const emailSubject = `[RESPON VENDOR] RFQ ${noRFQ} - ${vendorName} (${decision === 'Confirmed' ? 'BERSEDIA' : 'MENOLAK'})`;
      const emailBody = `Pemberitahuan SMMS BIMA:\n\nVendor ${vendorName} telah memberikan respon konfirmasi untuk RFQ ${noRFQ}.\n\nKeputusan: ${statusLabel}\nTanggal Respon: ${new Date().toLocaleString('id-ID')}\nCatatan Vendor: ${notes || '-'}\nTotal Penawaran: Rp ${(Number(grandTotal) || 0).toLocaleString('id-ID')}\n\n${decision === 'Confirmed' ? 'Vendor siap memenuhi pesanan dan Draft PO/SO telah dibuat secara otomatis. Silakan buka aplikasi SMMS BIMA (Menu Submit PO/SO) untuk mengajukan approval ke Direktur.' : 'Vendor menyatakan tidak dapat memenuhi pesanan ini. Silakan tinjau kembali seleksi vendor atau tunjuk vendor alternatif.'}`;
      
      fetch(RFQ_EMAIL_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "SEND_SIMPLE_EMAIL",
          to: HO_EMAIL,
          subject: emailSubject,
          body: emailBody
        })
      }).catch(e => console.warn('Gagal kirim notifikasi email respon vendor ke HO:', e.message));
    }

    document.getElementById("app").innerHTML = "";
    const successEl = document.getElementById("success");
    successEl.textContent = decision === 'Confirmed'
      ? "Terima kasih, kesediaan Anda sudah dikonfirmasi."
      : "Baik, kami sudah mencatat bahwa Anda tidak dapat memenuhi RFQ ini.";
    successEl.style.display = "block";
  } catch (err) {
    showError("Gagal mengirim konfirmasi: " + err.message);
    btnConfirm.disabled = false;
    btnReject.disabled = false;
  }
}

init();
</script>
</body>
</html>
