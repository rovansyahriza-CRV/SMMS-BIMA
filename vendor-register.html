<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi Vendor - BIMA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --dark: #3d3d3d;
    --orange: #e8562c;
    --bg: #fdf6f3;
    --text: #2c2c2c;
    --border: #e6ded9;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px;
    min-height: 100vh;
  }

  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(61, 61, 61, 0.14);
    overflow: hidden;
  }

  .header {
    background: #ffffff;
    padding: 28px 32px 20px;
    text-align: center;
    border-bottom: 3px solid var(--orange);
  }

  .header img {
    height: 64px;
    margin-bottom: 12px;
  }

  .header h1 {
    color: var(--dark);
    font-size: 20px;
    margin: 0 0 4px;
    font-weight: 700;
  }

  .header p {
    color: #8a8a8a;
    font-size: 13px;
    margin: 0;
  }

  .form-body {
    padding: 28px 32px 32px;
  }

  label {
    display: block;
    margin-top: 18px;
    font-weight: 600;
    font-size: 13px;
    color: var(--dark);
  }

  label .req { color: var(--orange); }

  input, select, textarea {
    width: 100%;
    padding: 11px 12px;
    box-sizing: border-box;
    font-size: 14px;
    margin-top: 6px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    color: var(--text);
    background: #fdfaf9;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(232, 86, 44, 0.15);
    background: #fff;
  }

  textarea { resize: vertical; }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  button {
    width: 100%;
    background: var(--orange);
    color: white;
    border: none;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    margin-top: 28px;
    transition: background 0.15s;
  }

  button:hover:not(:disabled) { background: #c8451f; }
  button:disabled { background: #aaa; cursor: not-allowed; }

  #error, #success {
    padding: 14px 16px;
    border-radius: 8px;
    margin: 0 32px 0;
    display: none;
    font-size: 14px;
  }

  #error { background: #FDEDED; color: #C0392B; border: 1px solid #f5c6c6; }
  #success { background: #FDF0EB; color: #b7451f; border: 1px solid #f2c9b8; }

  @media (max-width: 480px) {
    .row2 { grid-template-columns: 1fr; }
    .header, .form-body { padding-left: 20px; padding-right: 20px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
  <img src="logo-bima.png" alt="BIMA - Bilal Mitra Aryatama">
  <div style="font-size:10px; color:#aaa; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px; margin-bottom:8px;">
  Powered by Fusion Four
    <h1>Registrasi Vendor Baru</h1>
    <p>Isi data perusahaan Anda untuk terdaftar sebagai vendor</p>
  </div>

  <div class="form-body">
    <div id="error"></div>
    <div id="success"></div>

    <form id="registerForm">
      <label>Nama Perusahaan / Vendor <span class="req">*</span></label>
      <input type="text" id="vendorName" required>

      <div class="row2">
        <div>
          <label>Nama Penanggung Jawab <span class="req">*</span></label>
          <input type="text" id="authorizedName" required>
        </div>
        <div>
          <label>No. KTP / ID Penanggung Jawab</label>
          <input type="text" id="authorizedId">
        </div>
      </div>

      <div class="row2">
        <div>
          <label>Bidang / Spesialisasi</label>
          <input type="text" id="specialist" placeholder="cth: Material Bangunan">
        </div>
        <div>
          <label>Kategori</label>
          <select id="catagory">
            <option value="">-- Pilih Kategori --</option>
            <option value="Material">Material</option>
            <option value="Consumables">Consumables</option>
            <option value="Tools">Tools</option>
            <option value="HeavyEquipment">Heavy Equipment</option>
            <option value="Multi Kategori">Multi Kategori</option>
          </select>
        </div>
      </div>

      <label>Alamat <span class="req">*</span></label>
      <textarea id="address" rows="3" required></textarea>

      <div class="row2">
        <div>
          <label>No. Kontak <span class="req">*</span></label>
          <input type="text" id="contactNo" required>
        </div>
        <div>
          <label>Email <span class="req">*</span></label>
          <input type="email" id="email" required>
        </div>
      </div>

      <label>NPWP</label>
      <input type="text" id="npwp">

      <div class="row2">
        <div>
          <label>No. Rekening</label>
          <input type="text" id="rekeningNo">
        </div>
        <div>
          <label>Bank</label>
          <input type="text" id="bank">
        </div>
      </div>

      <button type="submit" id="submitBtn">Kirim Registrasi</button>
    </form>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nhmpwjriextmbotmvvbu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XNqLw7iz873TtrLn9ag8dQ_AkL2rImz';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Mengirim...";

  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";

  const data = {
    VendorName: document.getElementById("vendorName").value.trim(),
    AuthorizeName: document.getElementById("authorizedName").value.trim(),
    AuthorizeID: document.getElementById("authorizedId").value.trim(),
    Specialist: document.getElementById("specialist").value.trim(),
    Catagory: document.getElementById("catagory").value,
    Address: document.getElementById("address").value.trim(),
    ContactNo: document.getElementById("contactNo").value.trim(),
    Email: document.getElementById("email").value.trim(),
    NPWP: document.getElementById("npwp").value.trim(),
    RekeningNo: document.getElementById("rekeningNo").value.trim(),
    Bank: document.getElementById("bank").value.trim(),
    Status: "Review",
    VendorListDate: new Date().toISOString()
  };

  try {
    // Cek duplikat berdasarkan NPWP atau Email (kalau salah satunya diisi)
    if (data.NPWP || data.Email) {
      let dupQuery = supabaseClient.from("vendor").select("VendorID, VendorName, Status");
      if (data.NPWP && data.Email) {
        dupQuery = dupQuery.or(`NPWP.eq.${data.NPWP},Email.eq.${data.Email}`);
      } else if (data.NPWP) {
        dupQuery = dupQuery.eq("NPWP", data.NPWP);
      } else {
        dupQuery = dupQuery.eq("Email", data.Email);
      }
      const { data: dupRows, error: dupErr } = await dupQuery;
      if (dupErr) throw dupErr;

      if (dupRows && dupRows.length > 0) {
        errorEl.textContent = `Vendor "${dupRows[0].VendorName}" dengan NPWP/Email ini sudah terdaftar (status: ${dupRows[0].Status}). Silakan hubungi Admin jika ada perubahan data.`;
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Kirim Registrasi";
        return;
      }
    }

    const { error: insertErr } = await supabaseClient.from("vendor").insert(data);
    if (insertErr) throw insertErr;

    document.getElementById("registerForm").style.display = "none";
    const successEl = document.getElementById("success");
    successEl.textContent = "Registrasi berhasil dikirim. Tim kami akan meninjau data Anda.";
    successEl.style.display = "block";

  } catch (err) {
    errorEl.textContent = "Gagal mengirim registrasi: " + err.message;
    errorEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Kirim Registrasi";
  }
});
</script>
</body>
</html>
