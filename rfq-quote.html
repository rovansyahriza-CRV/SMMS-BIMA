<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Penawaran RFQ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 16px; color: #2C3E50; background: #fdf6f3; }
  h2 { margin-bottom: 4px; color: #3d3d3d; }
  .meta { color: #8a8a8a; margin-bottom: 20px; }

  .rfq-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(61, 61, 61, 0.12);
    padding: 32px;
  }

  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; border: none; }
  th, td { border: none; border-bottom: 1px solid #eee; padding: 12px 10px; font-size: 14px; text-align: left; }
  th { background: #3d3d3d; color: white; }
  th:first-child { border-top-left-radius: 8px; }
  th:last-child { border-top-right-radius: 8px; }

  input, textarea, select {
    width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    font-size: 14px;
    border: 1.5px solid #e6ded9;
    border-radius: 8px;
    background: #fdfaf9;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
    resize: vertical;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #e8562c;
    box-shadow: 0 0 0 3px rgba(232, 86, 44, 0.15);
    background: #fff;
  }

  button { background: #e8562c; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 8px; }
  button:hover:not(:disabled) { background: #c8451f; }
  button:disabled { background: #999; }

  #error, #success { padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  #error { background: #FADBD8; color: #C0392B; }
  #success { background: #D5F4E6; color: #1E8449; }

  .summary { border-top: 2px solid #eee; margin: 16px 0; padding-top: 12px; }
  .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
  .summary-row.total { font-weight: bold; font-size: 18px; border-top: 1px solid #eee; margin-top: 4px; padding-top: 10px; color: #3d3d3d; }

  .brand { text-align: center; margin-bottom: 24px; }
  .brand img { height: 56px; }
  .brand .powered { font-size: 10px; color: #999; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; }

  .pin-card {
    max-width: 380px;
    margin: 60px auto;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(61, 61, 61, 0.14);
    padding: 32px 28px;
    text-align: center;
  }
  .pin-card p { color: #666; font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  .pin-card input {
    text-align: center;
    font-size: 24px;
    letter-spacing: 10px;
    padding: 12px;
    width: 180px;
    margin-bottom: 16px;
  }
  .pin-card button { width: 100%; }
  .pin-card .pin-error { color: #C0392B; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>

<div class="brand">
  <img src="logo-bima.png" alt="BIMA - Bilal Mitra Aryatama">
  <div class="powered">Powered by Fusion Four</div>
</div>

<div id="error"></div>
<div id="success"></div>
<div id="app">Memuat data RFQ...</div>

<script>
const SUPABASE_URL = 'https://nhmpwjriextmbotmvvbu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XNqLw7iz873TtrLn9ag8dQ_AkL2rImz';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const EMAIL_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbww8VikG_wpAvQro1-9vLC_llnvKFigFotzKXS-T_kaIHKA4q2QGbYXqZObEF5j_1Hr/exec";
const HO_EMAIL = "rovan.syahriza@gmail.com";

const params = new URLSearchParams(window.location.search);
const rfqIdParam = Number(params.get("rfq"));
const vendorIdParam = Number(params.get("vendor"));

function formatAccounting(value) {
  const digits = String(value).replace(/\D/g, '');
  if (!digits) return '';
  return digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function parseAccountingToNumber(str) {
  return Number(String(str).replace(/\./g, '')) || 0;
}

function generateId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.floor(Math.random() * 100000);
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function init() {
  if (!rfqIdParam || !vendorIdParam) {
    showError("Link tidak lengkap. Pastikan Anda membuka link dari email undangan RFQ.");
    return;
  }

  try {
    const [
      { data: invitationRows, error: invErr },
      { data: rfqRows, error: rfqErr },
      { data: vendorRows, error: venErr },
      { data: detailRows, error: detErr }
    ] = await Promise.all([
      supabaseClient.from('rfqVendor').select('*').eq('RFQID', rfqIdParam).eq('VendorID', vendorIdParam),
      supabaseClient.from('rfq').select('*').eq('RFQID', rfqIdParam),
      supabaseClient.from('vendor').select('*').eq('VendorID', vendorIdParam),
      supabaseClient.from('rfqDetail').select('*').eq('RFQID', rfqIdParam)
    ]);
    if (invErr) throw invErr;
    if (rfqErr) throw rfqErr;
    if (venErr) throw venErr;
    if (detErr) throw detErr;

    const invitation = (invitationRows || [])[0];
    if (!invitation) {
      showError("Link tidak valid atau Anda tidak diundang untuk RFQ ini.");
      return;
    }

    const rfqHeader = (rfqRows || [])[0];
    const vendorInfo = (vendorRows || [])[0];
    const allItems = detailRows || [];

    if (allItems.length === 0) {
      showError("RFQ ini belum memiliki item.");
      return;
    }

    const detailIds = allItems.map(d => d.RFQDetailID);
    const { data: quoteRows, error: quoteErr } = await supabaseClient
      .from('rfqQuote')
      .select('RFQDetailID')
      .eq('VendorID', String(vendorIdParam))
      .in('RFQDetailID', detailIds.map(id => String(id)));
    if (quoteErr) throw quoteErr;

    const alreadyQuotedIds = (quoteRows || []).map(q => String(q.RFQDetailID));
    const items = allItems.filter(item => !alreadyQuotedIds.includes(String(item.RFQDetailID)));

    if (items.length === 0) {
      showError("Anda sudah mengirimkan penawaran untuk seluruh item RFQ ini. Terima kasih.");
      return;
    }

    const requestIds = [...new Set(items.map(i => i.RequestID).filter(Boolean))];
    let requestData = [];
    if (requestIds.length > 0) {
      const { data: reqRows, error: reqErr } = await supabaseClient
        .from('request').select('ID, ExpectedDate').in('ID', requestIds);
      if (reqErr) throw reqErr;
      requestData = reqRows || [];
    }

    if (invitation.PIN) {
      showPinGate(rfqHeader, vendorInfo, items, requestData, invitation.PIN, invitation);
    } else {
      renderForm(rfqHeader, vendorInfo, items, requestData, invitation);
    }
  } catch (err) {
    showError("Terjadi kendala memuat data: " + err.message + " Silakan muat ulang halaman.");
  }
}

function showError(msg) {
  const el = document.getElementById("error");
  el.textContent = msg;
  el.style.display = "block";
  document.getElementById("app").innerHTML = "";
}

function showPinGate(rfqHeader, vendorInfo, items, requestData, correctPin, invitation) {
  document.getElementById("app").innerHTML = `
    <div class="pin-card">
      <p>Masukkan PIN yang dikirimkan melalui email untuk melihat detail RFQ ini.</p>
      <input type="text" id="pinInput" maxlength="5" inputmode="numeric" placeholder="•••••">
      <button id="pinSubmitBtn">Buka RFQ</button>
      <div class="pin-error" id="pinError">PIN salah. Periksa kembali email undangan Anda.</div>
    </div>
  `;

  document.getElementById("pinSubmitBtn").addEventListener("click", checkPin);
  document.getElementById("pinInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") checkPin();
  });

  function checkPin() {
    const entered = document.getElementById("pinInput").value.trim();
    if (entered === String(correctPin).trim()) {
      renderForm(rfqHeader, vendorInfo, items, requestData, invitation);
    } else {
      document.getElementById("pinError").style.display = "block";
    }
  }
}

function renderForm(rfqHeader, vendorInfo, items, requestData, invitation) {
  const noRFQ = rfqHeader ? rfqHeader.NoRFQ : "-";
  const vendorName = vendorInfo ? vendorInfo.VendorName : "-";

  let rows = items.map((item, idx) => {
    const req = requestData.find(r => String(r.ID) === String(item.RequestID));
    const expectedDate = req ? req.ExpectedDate : "-";

    return `
    <tr data-detail-id="${item.RFQDetailID}">
      <td>${idx + 1}</td>
      <td>${item.ItemDescription}<br><small style="color:#999;">Dibutuhkan: ${expectedDate || '-'}</small></td>
      <td><input type="text" inputmode="numeric" class="qty" value="${formatAccounting(item.Qty)}" style="width:70px"> ${item.Unit || ''}</td>
      <td><textarea class="itemdesc" rows="2" placeholder="cth: merk/spek"></textarea></td>
      <td><input type="text" inputmode="numeric" class="price" required></td>
      <td><input type="date" class="deliverydate" required></td>
      <td><textarea class="notes" rows="2"></textarea></td>
    </tr>
    `;
  }).join("");

  document.getElementById("app").innerHTML = `
    <div class="rfq-card">
      <h2>Input Penawaran Harga</h2>
      <div class="meta">
        No RFQ: <strong>${noRFQ}</strong><br>
        Vendor: <strong>${vendorName}</strong>
      </div>
      <form id="quoteForm">
        <table id="itemsTable">
          <colgroup>
            <col style="width:4%">
            <col style="width:16%">
            <col style="width:8%">
            <col style="width:16%">
            <col style="width:22%">
            <col style="width:18%">
            <col style="width:16%">
          </colgroup>
          <thead>
            <tr><th>No</th><th>Item</th><th>Qty</th><th>Deskripsi Vendor</th><th>Harga Satuan (Rp)</th><th>Tanggal Kirim</th><th>Catatan</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="additional-cost" style="border-top:2px solid #eee; margin-top:16px; padding-top:16px;">
          <h3 style="font-size:16px; color:#3d3d3d; margin-bottom:12px;">Biaya Tambahan & Termin Pembayaran</h3>

          <table style="margin-bottom:16px;">
            <tr>
              <td style="border:none;">Biaya Mobilisasi (Rp)</td>
              <td style="border:none;"><input type="text" inputmode="numeric" id="mobilisasiCost" placeholder="Included"></td>
            </tr>
            <tr>
              <td style="border:none;">Biaya Jasa Lain (Rp)</td>
              <td style="border:none;"><input type="text" inputmode="numeric" id="otherServiceCost" placeholder="Included"></td>
            </tr>
            <tr>
              <td style="border:none;">Deskripsi Jasa Lain</td>
              <td style="border:none;"><textarea id="otherServiceDesc" rows="2" placeholder="cth: Instalasi + Training"></textarea></td>
            </tr>
            <tr>
              <td style="border:none;">Termin Pembayaran</td>
              <td style="border:none;">
              <select id="paymentTermType">
                <option value="Full Before Delivery">Full Before Delivery</option>
                <option value="Full After Received">Full After Received</option>
                <option value="Partial">Partial (DP + Sisa)</option>
                <option value="30 Days After Invoice Received">30 Days After Invoice Received</option>
                <option value="Back to Back Payment">Back to Back Payment</option>
              </select>
              </td>
            </tr>
            <tr id="dpRow" style="display:none;">
              <td style="border:none;">DP (%)</td>
              <td style="border:none;"><input type="number" id="dpPercentage" min="1" max="99" placeholder="cth: 30"></td>
            </tr>
            <tr>
              <td style="border:none;">Lampirkan Quotation (PDF)</td>
              <td style="border:none;"><input type="file" id="vendorAttachment" accept="application/pdf"></td>
            </tr>
          </table>
        </div>

        <div class="summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotalDisplay">Rp 0</span>
          </div>
          <div class="summary-row">
            <label><input type="checkbox" id="ppnCheckbox" style="width:auto;"> Sertakan PPN (11%)</label>
          </div>
          <div class="summary-row total">
            <span>Total Harga</span>
            <span id="totalDisplay">Rp 0</span>
          </div>
        </div>

        <button type="submit" id="submitBtn">Kirim Penawaran</button>
      </form>
    </div>
  `;

  function calculateSummary() {
    const qtyInputs = document.querySelectorAll("#quoteForm .qty");
    const priceInputs = document.querySelectorAll("#quoteForm .price");
    let subtotal = 0;

    for (let i = 0; i < qtyInputs.length; i++) {
      const qty = parseAccountingToNumber(qtyInputs[i].value);
      const price = parseAccountingToNumber(priceInputs[i].value);
      subtotal += qty * price;
    }

    const ppnChecked = document.getElementById("ppnCheckbox").checked;
    const total = ppnChecked ? subtotal * 1.11 : subtotal;

    document.getElementById("subtotalDisplay").textContent = "Rp " + subtotal.toLocaleString("id-ID");
    document.getElementById("totalDisplay").textContent = "Rp " + total.toLocaleString("id-ID");
  }

  document.querySelectorAll("#quoteForm .qty, #quoteForm .price").forEach(el => {
    el.addEventListener("input", (e) => {
      const raw = parseAccountingToNumber(e.target.value);
      e.target.value = raw ? formatAccounting(raw) : '';
      calculateSummary();
    });
  });

  document.getElementById("ppnCheckbox").addEventListener("change", calculateSummary);
  calculateSummary();

  document.querySelectorAll("#mobilisasiCost, #otherServiceCost").forEach(el => {
    el.addEventListener("input", (e) => {
      const raw = parseAccountingToNumber(e.target.value);
      e.target.value = raw ? formatAccounting(raw) : '';
      calculateSummary();
    });
  });

  document.getElementById("paymentTermType").addEventListener("change", (e) => {
    document.getElementById("dpRow").style.display = e.target.value === "Partial" ? "table-row" : "none";
  });

  document.getElementById("quoteForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    await submitQuotes(items, rfqHeader, vendorInfo, invitation);
  });
}

async function submitQuotes(items, rfqHeader, vendorInfo, invitation) {
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Mengirim...";
  const rows = document.querySelectorAll("#itemsTable tbody tr");
  const now = new Date().toISOString();
  const quoteLines = [];
  let itemSubtotal = 0;
  try {
    const quoteInserts = [];
    for (let idx = 0; idx < rows.length; idx++) {
      const row = rows[idx];
      const item = items[idx];
      const desc = row.querySelector(".itemdesc").value;
      const qty = parseAccountingToNumber(row.querySelector(".qty").value);
      const price = parseAccountingToNumber(row.querySelector(".price").value);
      const deliveryDate = row.querySelector(".deliverydate").value;
      const notes = row.querySelector(".notes").value;
      itemSubtotal += qty * price;
      quoteLines.push({
        item: item.ItemDescription,
        unit: item.Unit,
        qty: qty,
        desc: desc,
        price: price,
        deliveryDate: deliveryDate,
        notes: notes
      });
      quoteInserts.push({
        RFQQuoteID: generateId(),
        RFQDetailID: String(item.RFQDetailID),
        VendorID: String(vendorIdParam),
        VendorItemDescription: desc,
        UnitPrice: String(price),
        QuoteDate: now,
        Notes: notes,
        VendorDeliveryDate: deliveryDate,
        Qty: String(qty)
      });
    }

    const { error: quoteInsertErr } = await supabaseClient.from('rfqQuote').insert(quoteInserts);
    if (quoteInsertErr) throw quoteInsertErr;

    const mobilisasi = parseAccountingToNumber(document.getElementById("mobilisasiCost").value);
    const otherService = parseAccountingToNumber(document.getElementById("otherServiceCost").value);
    const subtotalWithExtra = itemSubtotal + mobilisasi + otherService;
    const ppnChecked = document.getElementById("ppnCheckbox").checked;
    const ppnAmount = ppnChecked ? subtotalWithExtra * 0.11 : 0;

    const termData = {
      RFQVendorID: invitation.RFQVendorID,
      MobilisasiCost: mobilisasi,
      OtherServiceCost: otherService,
      OtherServiceDescription: document.getElementById("otherServiceDesc").value,
      PaymentTermType: document.getElementById("paymentTermType").value,
      DPPercentage: document.getElementById("paymentTermType").value === "Partial"
        ? Number(document.getElementById("dpPercentage").value) : null,
      PPNAmount: ppnAmount,
      SubmitDate: now
    };
    const { error: termErr } = await supabaseClient.from('rfqVendorTerm').insert(termData);
    if (termErr) throw termErr;

    await supabaseClient.from('rfqVendor').update({
      ConfirmationStatus: 'Submitted',
      ConfirmationDate: now
    }).eq('RFQVendorID', invitation.RFQVendorID);

    const attachmentFile = document.getElementById("vendorAttachment").files[0];
    let vendorAttachmentBase64 = null, vendorAttachmentFileName = null;
    if (attachmentFile) {
      vendorAttachmentBase64 = await readFileAsBase64(attachmentFile);
      vendorAttachmentFileName = attachmentFile.name;
    }

    sendQuotePdf(rfqHeader, vendorInfo, quoteLines, termData, vendorAttachmentBase64, vendorAttachmentFileName)
      .catch(err => console.error("Gagal kirim PDF:", err));

    document.getElementById("app").innerHTML = "";
    const successEl = document.getElementById("success");
    successEl.textContent = "Penawaran berhasil dikirim. Terima kasih.";
    successEl.style.display = "block";
  } catch (err) {
    showError("Gagal mengirim penawaran: " + err.message);
    btn.disabled = false;
    btn.textContent = "Kirim Penawaran";
  }
}

function generateQuotePdfBase64(rfqHeader, vendorInfo, quoteLines, termData) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const noRFQ = rfqHeader ? rfqHeader.NoRFQ : "-";
  const vendorName = vendorInfo ? vendorInfo.VendorName : "-";

  doc.setFontSize(14);
  doc.text("Ringkasan Penawaran RFQ", 14, 18);
  doc.setFontSize(10);
  doc.text(`No RFQ: ${noRFQ}`, 14, 26);
  doc.text(`Vendor: ${vendorName}`, 14, 32);
  doc.text(`Tanggal: ${new Date().toLocaleDateString('id-ID')}`, 14, 38);

  let y = 48;
  doc.setFontSize(9);
  doc.text("No", 14, y);
  doc.text("Item / Deskripsi Vendor", 24, y);
  doc.text("Qty", 100, y);
  doc.text("Harga Satuan", 118, y);
  doc.text("Kirim", 155, y);
  doc.text("Catatan", 178, y);
  y += 4;
  doc.line(14, y, 196, y);
  y += 6;

  let subtotal = 0;
  quoteLines.forEach((l, i) => {
    subtotal += (Number(l.qty) || 0) * (Number(l.price) || 0);
    const displayText = l.desc ? `${l.item} - ${l.desc}` : l.item;
    const wrappedLines = doc.splitTextToSize(displayText, 74);

    doc.text(String(i + 1), 14, y);
    doc.text(wrappedLines, 24, y);
    doc.text(`${l.qty} ${l.unit}`, 100, y);
    doc.text("Rp " + Number(l.price).toLocaleString("id-ID"), 118, y);
    doc.text(l.deliveryDate || "-", 155, y);
    doc.text(String(l.notes || "-").substring(0, 14), 178, y);

    const lineHeight = 5;
    y += Math.max(wrappedLines.length * lineHeight, 7);
  });

  y += 3;
  doc.line(14, y, 196, y);
  y += 8;
  doc.setFontSize(11);
  doc.text(`Subtotal: Rp ${subtotal.toLocaleString("id-ID")}`, 130, y);

  if (termData) {
    y += 12;
    doc.setFontSize(11);
    doc.text("Biaya Tambahan & Termin Pembayaran", 14, y);
    y += 7;
    doc.setFontSize(9);

    doc.text(`Mobilisasi: Rp ${(termData.MobilisasiCost || 0).toLocaleString("id-ID")}${termData.MobilisasiCost ? "" : " (Included)"}`, 14, y);
    y += 6;
    doc.text(`Jasa Lain: Rp ${(termData.OtherServiceCost || 0).toLocaleString("id-ID")}${termData.OtherServiceCost ? "" : " (Included)"}`, 14, y);
    y += 6;

    if (termData.OtherServiceDescription) {
      const descLines = doc.splitTextToSize(`Deskripsi Jasa: ${termData.OtherServiceDescription}`, 182);
      doc.text(descLines, 14, y);
      y += descLines.length * 5;
    }

    doc.text(`Termin Pembayaran: ${termData.PaymentTermType}`, 14, y);
    y += 6;

    if (termData.PaymentTermType === "Partial" && termData.DPPercentage) {
      doc.text(`DP: ${termData.DPPercentage}% / Sisa: ${100 - termData.DPPercentage}%`, 14, y);
      y += 6;
    }

    doc.text(`PPN 11%: ${termData.PPNAmount > 0 ? "Rp " + Math.round(termData.PPNAmount).toLocaleString("id-ID") : "Tidak dikenakan"}`, 14, y);
    y += 6;
  }

  return doc.output('datauristring').split(',')[1];
}

async function sendQuotePdf(rfqHeader, vendorInfo, quoteLines, termData, vendorPdfBase64, vendorPdfFileName) {
  const pdfBase64 = generateQuotePdfBase64(rfqHeader, vendorInfo, quoteLines, termData);
  const noRFQ = rfqHeader ? rfqHeader.NoRFQ : "RFQ";
  const vendorName = vendorInfo ? vendorInfo.VendorName : "Vendor";
  const vendorEmail = vendorInfo ? vendorInfo.Email : "";

  const recipients = [HO_EMAIL];
  if (vendorEmail) recipients.push(vendorEmail);

  const payload = {
    action: "SEND_EMAIL",
    to: recipients.join(","),
    subject: `Penawaran RFQ - ${noRFQ} dari ${vendorName}`,
    body: `Penawaran dari ${vendorName} untuk ${noRFQ} telah diterima. Ringkasan penawaran terlampir dalam PDF.`,
    pdfBase64: pdfBase64,
    fileName: `Penawaran-${noRFQ}-${vendorName}.pdf`,
    vendorPdfBase64: vendorPdfBase64 || null,
    vendorPdfFileName: vendorPdfFileName || (`Quotation-${noRFQ}-${vendorName}.pdf`)
  };

  const res = await fetch(EMAIL_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const result = await res.json();
  if (!result.success) throw new Error(result.error || "Gagal mengirim PDF");
}

init();
</script>
</body>
</html>
