<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMMS-BIMA — Material Request</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="mark">SMMS</span>
    <span class="site-name">BIMA</span>
    <a href="index.html" class="logout-btn" style="text-decoration:none;display:inline-block">Menu</a>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">Material request</span>
    <h1>Ajukan permintaan material</h1>
    <p class="sub">Isi data umum sekali, lalu tambahkan item sebanyak yang dibutuhkan. Semua item dikirim jadi satu permintaan ke HO.</p>
  </div>

  <form id="requestForm" autocomplete="off">

    <!-- Data umum (berlaku untuk semua item di bawah) -->
    <div class="card">
      <div class="card-title">Data Umum</div>

      <div class="field-row two">
        <div class="field">
          <label for="projectId">Project ID</label>
          <div id="projectIdWrap">
            <input type="text" id="projectId" required placeholder="cth. 101">
          </div>
        </div>
        <div class="field">
          <label for="woNo">Nomor WO</label>
          <input type="text" id="woNo" required placeholder="cth. WO-2026-001">
        </div>
      </div>

      <div class="field">
        <label for="purpose">Keperluan</label>
        <input type="text" id="purpose" required placeholder="Untuk keperluan apa material ini dipakai">
      </div>

      <div class="field">
        <label for="expectedDate">Tanggal dibutuhkan</label>
        <input type="date" id="expectedDate" required>
      </div>

      <p class="hint-note">No. Referensi akan dibuat otomatis oleh sistem saat permintaan dikirim.</p>
    </div>

    <!-- Detail item — bisa lebih dari 1 baris -->
    <div class="card" style="margin-top:16px;">
      <div class="card-title-row">
        <span class="card-title">Detail Item</span>
        <button type="button" id="btnAddItem" class="btn-add-row" title="Tambah item">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Tambah Item</span>
        </button>
      </div>

      <div id="itemRowsBody"></div>
    </div>

    <div id="formMsg" class="form-msg" role="status" aria-live="polite"></div>

    <button type="submit" id="submitBtn" class="btn-submit">Kirim Semua Item Request</button>
  </form>

  <p class="footnote">Diajukan oleh <span id="requestByLabel">—</span></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="driveBridge.js"></script>
<script src="reportPdf.js"></script>
<script src="script.js"></script>
</body>
</html>
